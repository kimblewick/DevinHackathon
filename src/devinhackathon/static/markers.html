<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAINTBALL — marker sheet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="print">
<main>
  <div class="noprint" style="padding:10px 0">
    <b>Marker sheet (#1–#20)</b> — print, cut out, hand one to each player. The
    number on the marker is the player's number: they type it when joining. Wear
    it on the chest or back, flat, at least ~5&nbsp;cm wide, in good light.
    Individual files: <code>/markers/1.svg</code> … <code>/markers/20.svg</code>.
    <button class="small" onclick="window.print()">PRINT</button>
  </div>
  <div id="sheet"></div>
</main>
<script src="/markers.js"></script>
</body>
</html>
