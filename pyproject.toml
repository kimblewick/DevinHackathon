[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devinhackathon"
version = "0.1.0"
description = "Raspberry Pi project"
requires-python = ">=3.9"
dependencies = [
    "gpiozero>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
devinhackathon = "devinhackathon.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
